<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

<h2>HY-GEN LIFF TEST</h2>

<div id="status">Loading...</div>

<script>

(async () => {

  const status =
    document.getElementById("status");

  try {

    await liff.init({
      liffId: "2011746131-4t8968gD",
      withLoginOnExternalBrowser: true
    });

    status.innerHTML =
      "isInClient = " +
      liff.isInClient() +
      "<br><br>" +
      "isLoggedIn = " +
      liff.isLoggedIn();

  }
  catch(e){

    status.innerHTML =
      "ERROR = " +
      (e.message || JSON.stringify(e));

  }

})();

</script>

</body>
</html>
