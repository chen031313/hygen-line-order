<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

<h2>HY-GEN User ID 測試</h2>

<div id="status">Loading...</div>

<script>

(async () => {

  const status =
    document.getElementById("status");

  try {

    await liff.init({
      liffId: "2011746131-4t8968gD",
      withLoginOnExternalBrowser: true
    });

    const profile =
      await liff.getProfile();

    status.innerHTML =
      "LINE暱稱：<br>" +
      profile.displayName +
      "<br><br>" +
      "User ID：<br>" +
      profile.userId;

  }
  catch(e){

    status.innerHTML =
      "ERROR：<br>" +
      (e.message || JSON.stringify(e));

  }

})();

</script>

</body>
</html>
